name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: npm run package

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## VS Code Extension ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/ason-format/vscode-extension/blob/main/CHANGELOG.md) for details.

            ### Installation

            Download the `.vsix` file below and install it in VS Code:

            ```bash
            code --install-extension vscode-ason-${{ steps.version.outputs.VERSION }}.vsix
            ```

            Or install from VS Code Marketplace (after publishing):

            ```
            Extensions → Search "ASON"
            ```

            ### Commands

            - `ASON: Compress Selection` - Convert JSON to ASON
            - `ASON: Decompress Selection` - Convert ASON to JSON
            - `ASON: Show Compression Stats` - View detailed metrics
          files: |
            vscode-ason-${{ steps.version.outputs.VERSION }}.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Success notification
        run: |
          echo "✓ GitHub Release created with VSIX file"
          echo "✓ To publish to marketplace, run: npm run publish"
